# =============================================================================
# .github/workflows/harness.yml   —  CALLER workflow (service repo)
# Goes in each SERVICE repo (sample-book-service, harness-book-service, etc.).
# Thin by design: it only invokes the reusable engine. All the real logic lives
# in harness-engine; skills/instructions are pulled from copilot-toolkit at run.
# =============================================================================
name: Harness

on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "Story / feature id to run"
        required: true

jobs:
  harness:
    uses: mgganeshguptha-source/harness-engine/.github/workflows/harness.yml@main
    with:
      feature_id: ${{ inputs.feature_id }}
      java-version: "17"
      python-version: "3.13"
      node-version: "20"
      # engine_ref defaults to v1; toolkit_ref defaults to main — no need to set.
    secrets: inherit
