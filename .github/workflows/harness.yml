name: Harness
on:
  workflow_dispatch:
    inputs:
      feature_id:
        description: "Story / feature id to run"
        required: true
jobs:
  harness:
    uses: mgganeshguptha-source/harness-engine/.github/workflows/harness.yml@v1
    with:
      feature_id: ${{ inputs.feature_id }}
      java-version: "17"
      python-version: "3.13"
      node-version: "20"
    secrets: inherit
